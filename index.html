<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Roastery OMS</title>
<style>
  :root {
    --bg: #f2f4f8; --card: #ffffff; --ink: #14213d; --muted: #5d6a80; --line: #dce2eb; --header: #13294b;
    --accent: #1f4f9a; --ok: #2f7a4a; --err: #a33a2b; --warn: #9a6a12; --chip: #e7ecf4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1322; --card: #141e33; --ink: #e8edf6; --muted: #9aa7bd; --line: #26334f; --header: #0a1a33; --accent: #3d6bb8; --ok: #6cc28c; --err: #ef8a7a; --warn: #e2b456; --chip: #1e2b46; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--header); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; }
  header .who { font-size: 13px; opacity: .85; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .login { max-width: 360px; margin: 40px auto; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font: inherit; }
  .btn { border: 0; border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
  .btn.ok { background: var(--ok); }
  .btn.ghost { background: transparent; color: var(--err); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip b { font-weight: 700; margin-left: 4px; }
  .grow { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .order .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .items { margin: 8px 0; font-size: 14px; }
  .items div { display: flex; justify-content: space-between; gap: 8px; }
  .items div > span:last-child { white-space: nowrap; }
  .ship-mini .status { align-self: flex-start; flex-shrink: 0; }
  .total { display: flex; justify-content: space-between; font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .status { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--chip); white-space: nowrap; }
  .st-MASUK { color: var(--warn); } .st-DIVALIDASI { color: var(--accent); } .st-SELESAI { color: var(--ok); } .st-BATAL { color: var(--muted); }
  .soon { border-left: 3px solid var(--warn); }
  .msg { padding: 28px; text-align: center; color: var(--muted); }
  .err { color: var(--err); }
  .alert { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
  .alert.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .alert.bad { background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); }
  .btn.sec { background: var(--chip); color: var(--ink); border: 1px solid var(--line); }
  .form { max-width: 640px; margin: 0 auto; }
  .form h2 { font-size: 18px; margin: 0 0 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .stepper button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); font-size: 17px; cursor: pointer; }
  .stepper input { width: 52px; height: 34px; padding: 0; text-align: center; font-weight: 600; }
  .stepper input.changed { border-color: var(--accent); color: var(--accent); }
  .picks { border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; overflow: hidden; }
  .picks button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-top: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
  .picks button:first-child { border-top: 0; }
  .picks button:hover { background: var(--chip); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 14px; color: var(--ink); }
  .check input { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; }
  .savebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; }
  .hist { white-space: pre-line; font-size: 12px; color: var(--muted); margin-top: 6px; }
  nav#tabs { display: flex; gap: 4px; max-width: 980px; margin: 0 auto; padding: 12px 16px 0; overflow-x: auto; }
  nav#tabs:empty { display: none; }
  nav#tabs .tab { white-space: nowrap; flex: none; }
  @media (max-width: 480px) { nav#tabs .tab { padding: 8px 9px; font-size: 14px; } }
  .tab { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 10px 10px 0 0; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .ships { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .ship-mini { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 2px 0; }
  .st-DIPROSES, .st-DIKIRIM, .st-SEBAGIAN, .st-DIRENCANAKAN, .st-SIAP_KIRIM { color: var(--accent); }
  .st-TERKIRIM { color: var(--ok); }
  .day { margin-bottom: 22px; }
  .day h3 { margin: 0 0 8px; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl td, .tbl th { padding: 8px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  .tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 0; }
  .tbl .num { text-align: right; font-weight: 700; white-space: nowrap; }
  .who-list { color: var(--muted); font-size: 13px; }
  .group-h { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; }
  select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font: inherit; }
  .inline { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .inline input, .inline select { padding: 7px 10px; font-size: 14px; }
  .inline .btn { padding: 7px 12px; font-size: 13px; white-space: nowrap; }
  .rtag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 1px 7px; background: var(--chip); color: var(--ink); }
  .rtag.none { color: var(--warn); }
  .rute-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin: 14px 0 2px; font-weight: 700; }
  .rute-h .sub { font-weight: 400; }
  .warnbox { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--card); border-radius: 8px; margin-bottom: 12px; font-size: 13.5px; }
  .ckrow { display: flex; align-items: center; gap: 12px; margin: 0; font-size: inherit; color: var(--ink); cursor: pointer; }
  .ck { width: 20px; height: 20px; flex: none; accent-color: var(--accent); cursor: pointer; }
  .row.picked { background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .card.picked { outline: 2px solid var(--ok); }
  .bulkbar { position: sticky; bottom: 0; z-index: 5; display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 0; margin-top: 12px; }
  .bulkbar .sub { margin-right: auto; }
  .pending { opacity: .55; pointer-events: none; }
  .date-h { margin: 26px 0 0; padding-top: 14px; border-top: 2px solid var(--line); font-size: 18px; }
  .date-h:first-of-type { border-top: 0; padding-top: 0; }
  .date-h.late { color: var(--err); }
  .label-sec { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
  .group-h .rwho { text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 600; }
  .group-h .rwho.none { color: var(--muted); font-weight: 400; }
  .saran { font-size: 13px; margin-top: 4px; color: var(--muted); }
  .saran .lotcode { font-size: 13px; }
  .kreditwarn { font-size: 13px; color: var(--err); font-weight: 600; margin: 4px 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile.bad .v { color: var(--err); }
  .invrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .invrow .r { text-align: right; font-variant-numeric: tabular-nums; }
  .late { color: var(--err); font-weight: 600; }
  .payrow { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .payrow input[type=checkbox] { width: 20px; height: 20px; flex: none; margin: 0; }
  .payrow input[inputmode] { width: 130px; flex: none; text-align: right; }
  .payrow .grow { flex: 1; min-width: 0; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin: 8px 0 4px; }
  .bars div { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .barlbl { display: flex; gap: 4px; font-size: 10px; color: var(--muted); }
  .barlbl span { flex: 1; text-align: center; }
  .linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
  .loktag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: var(--st-prod-bg); color: var(--st-prod); }
  .loktag.ok { background: var(--st-siap-bg); color: var(--st-siap); }
  .row.done { opacity: .75; }
  .lotline { font-size: 13px; color: var(--muted); margin: 2px 0 4px 14px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .lotline select { font-size: 13px; padding: 3px 6px; max-width: 220px; }
  .lotcode { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; color: var(--ink); }
  .lotnone { color: var(--warn); font-weight: 600; }
  .bigcode { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 34px; font-weight: 700; letter-spacing: .02em; margin: 6px 0; word-break: break-all; }
  .rep { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rep th, .rep td { border: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  .rep th { background: var(--card, #fff); font-weight: 600; }
  .rep td.num, .rep th.num { text-align: right; }
  .tblwrap { overflow-x: auto; }
  .printonly { display: none; }
  .mobonly { display: none; }
  @media (max-width: 600px) { .mobonly { display: block; } }
  .kcard h2 { display: flex; gap: 10px; align-items: center; }
  .stepno { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 15px; flex: none; }
  .packrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .packrow .grow { flex: 1; }
  .packrow input { width: 90px; text-align: right; }
  .kgbar { font-size: 14px; margin-top: 10px; }
  .kgbar.over { color: var(--err); font-weight: 600; }
  .batchrow { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .batchrow .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .labelbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .labelbox input { width: 80px; }
  #printArea { display: none; }
  body.printing #printArea { display: block; }
  body.printing #printArea.sz-a4 { display: grid; }
  body.printing > :not(#printArea) { display: none !important; }
  .lbl { box-sizing: border-box; overflow: hidden; color: #000; font-family: Arial, Helvetica, sans-serif; break-inside: avoid; page-break-inside: avoid; }
  .lbl .co { font-size: 6.5pt; }
  .lbl .pn { font-size: 9pt; font-weight: 700; line-height: 1.15; margin: 1mm 0; }
  .lbl .kd { font-size: 10pt; font-weight: 700; font-family: 'Courier New', monospace; }
  .lbl .ln { font-size: 7pt; line-height: 1.3; }
  .lbl.wadah .kd { font-size: 16pt; }
  .sz-roll .lbl { width: 50mm; height: 30mm; padding: 2mm 2.5mm; page-break-after: always; break-after: page; }
  .sz-a4 { display: grid; grid-template-columns: repeat(3, 63.5mm); grid-auto-rows: 38.1mm; column-gap: 2.5mm; }
  .sz-a4 .lbl { padding: 3mm; border: 0.2mm dashed #bbb; }
  @media print {
    header, nav, .filters, .noprint, .alert { display: none !important; }
    .printonly { display: block; }
    body { background: #fff; }
    .rep { font-size: 10px; }
  }

  /* Warna status: kuning = masih produksi, hijau = siap kirim, biru = dalam perjalanan */
  :root { --st-prod-bg: #fff1c2; --st-prod: #7a5800; --st-siap-bg: #d9f2df; --st-siap: #1e6b3a; --st-jalan-bg: #dbe9fb; --st-jalan: #1f4f8f; --st-masuk-bg: #fde3cf; --st-masuk: #9a4a12; }
  @media (prefers-color-scheme: dark) { :root { --st-prod-bg: #4a3a0c; --st-prod: #ffd968; --st-siap-bg: #173d24; --st-siap: #8fe0aa; --st-jalan-bg: #18304f; --st-jalan: #9cc4f5; --st-masuk-bg: #4a2a14; --st-masuk: #f4b98a; } }
  .status.st-MASUK { background: var(--st-masuk-bg); color: var(--st-masuk); }
  .status.st-DIVALIDASI, .status.st-DIPROSES, .status.st-DIRENCANAKAN { background: var(--st-prod-bg); color: var(--st-prod); }
  .status.st-SIAP_KIRIM { background: var(--st-siap-bg); color: var(--st-siap); }
  .status.st-DIKIRIM, .status.st-SEBAGIAN { background: var(--st-jalan-bg); color: var(--st-jalan); }
  .status.st-TERKIRIM, .status.st-SELESAI { background: var(--chip); color: var(--ink); }
  .status.st-TERKIRIM::before, .status.st-SELESAI::before { content: '✓ '; }
  .status.st-BATAL { background: transparent; color: var(--muted); }
  .card.order.bd-DIRENCANAKAN { border-left: 4px solid #e8b923; }
  .card.order.bd-SIAP_KIRIM { border-left: 4px solid #2f9a55; }
  .card.order.bd-DIKIRIM { border-left: 4px solid #3b78c4; }

  /* ===== Tampilan HP (layar sempit): semua bisa dipakai tanpa memutar layar ===== */
  @media (max-width: 600px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 17px; }
    main { padding-left: 12px; padding-right: 12px; }
    nav#tabs { flex-wrap: wrap; overflow: visible; gap: 2px 0; padding: 8px 8px 0; }
    nav#tabs .tab { padding: 8px 4px; font-size: 14px; flex: 0 0 33.33%; text-align: center; }
    .filters { gap: 6px; margin-bottom: 10px; }
    .chip { padding: 5px 10px; font-size: 12.5px; }
    .filters input[type=date] { max-width: 150px !important; }
    .filters input:not([type]) , .filters input[type=search] { flex: 1 1 100%; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
    .card { padding: 12px; }
    .btn { padding: 9px 14px; }
    /* Produksi: tombol Sebagian pindah ke bawah, isi pesanan dapat lebar penuh */
    .row:has(.ckrow) { flex-wrap: wrap; align-items: flex-start; }
    .row:has(.ckrow) .ckrow { flex: 1 1 100%; align-items: flex-start; }
    .row:has(.ckrow) > .btn { margin-left: 36px; padding: 6px 12px; font-size: 13px; }
    .tbl td, .tbl th { padding: 6px 4px; }
    /* Bar Siap kirim di bawah: ringkas */
    .bulkbar { padding: 8px 0; }
    .bulkbar .sub { display: none; }
    .bulkbar .btn { flex: 1; }
    .savebar { gap: 8px; }
    .date-h { font-size: 16px; }
    .inline input, .inline select { min-width: 0; flex: 1 1 auto; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .tile .v { font-size: 16px; }
  }
</style>
</head>
<body>
<header><h1>Roastery OMS</h1><div id="who"></div></header>
<nav id="tabs"></nav>
<main id="main"></main>

<script>
// Ganti dengan URL web app Apps Script OMS (sama dengan di index.html)
const API = 'https://script.google.com/macros/s/AKfycbwbu1fvp32o9mqQyXCYI8GIBPD18IGYO69CZyKuaOfLvj7etOe_GSMCFTgLuvzqfr1x/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = s => { const d = new Date(String(s).slice(0, 10) + 'T00:00:00+08:00'); return isNaN(d) ? s : d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' }); };
const FILTERS = [['MASUK', 'Pesanan masuk'], ['DIVALIDASI', 'Divalidasi'], ['BERJALAN', 'Diproses & dikirim'], ['SELESAI', 'Terkirim'], ['BATAL', 'Dibatalkan'], ['', 'Semua']];
const BERJALAN = ['DIPROSES', 'DIKIRIM', 'SEBAGIAN'];
const SHIP_FILTERS = [['AKTIF', 'Belum terkirim'], ['DIRENCANAKAN', 'Masih produksi'], ['SIAP_KIRIM', 'Siap dikirim'], ['DIKIRIM', 'Dalam perjalanan'], ['TERKIRIM', 'Terkirim'], ['BATAL', 'Dibatalkan']];
const NEXT = { DIRENCANAKAN: ['SIAP_KIRIM', 'Siap dikirim'], SIAP_KIRIM: ['DIKIRIM', 'Dibawa kurir (manual)'], DIKIRIM: ['TERKIRIM', 'Tandai terkirim (manual)'] };
const store = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };

let auth = null, all = [], filter = 'MASUK', q = '', flash = null, today = '', view = 'pesanan';
let prodData = null, shipData = null, couriers = [], shipFilter = 'AKTIF', shipDate = '', shipForm = null, shipGroup = 'rute';
let prodPick = new Set(), shipPick = new Set(), busy = false;
let ruteKurir = {}, prodLok = null, lokUtama = 'Anggrek', alurPindah = true, terimaPick = new Set();
let tgView = 'belum', tgInv = null, tgPay = null, tgBadge = 0, tgOpen = null, tgForm = null;
let lotData = null, batchForm = null, packForm = null, lotDone = null, labelFor = null, repJenis = 'form17', repBulan = '', repData = null;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
const ruteLabel = r => r || 'Belum ada rute';
const ruteTag = o => `<span class="rtag${o.rute ? '' : ' none'}">${esc(ruteLabel(o.rute))}</span>`;
const isAdmin = () => auth && String(auth.peran || '').toLowerCase() === 'admin';
const canShip = () => auth && ['admin', 'produksi'].includes(String(auth.peran || '').toLowerCase());
try { auth = JSON.parse(store.get('oms_admin') || 'null'); } catch (e) {}

async function api(body) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) {
    const r = await fetch(API + '?q=' + encodeURIComponent(JSON.stringify(body)));
    return await r.json();
  }
}

function renderLogin(err) {
  $('#who').innerHTML = '';
  $('#main').innerHTML = `<form class="card login" id="lf">
    <div class="name">Masuk sebagai staff</div>
    <label for="sid">ID staff</label><input id="sid" autocomplete="username" placeholder="A-01" required>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
    ${err ? `<p class="err" style="margin:10px 0 0">${esc(err)}</p>` : ''}
    <button class="btn" style="margin-top:14px;width:100%">Masuk</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const a = { staffId: $('#sid').value.trim(), pin: $('#pin').value.trim() };
    const r = await api(Object.assign({ action: 'adminLogin' }, a));
    if (!r.ok) return renderLogin(r.error);
    auth = Object.assign(a, { nama: r.staff.nama, peran: r.staff.peran, lokasi: r.staff.lokasi || '' });
    store.set('oms_admin', JSON.stringify(auth));
    view = isAdmin() ? 'pesanan' : canShip() ? 'produksi' : 'pesanan';
    load();
  };
}

function logout() { auth = null; store.del('oms_admin'); renderLogin(); }

/* Tombol Muat ulang: tampilkan proses & hasil supaya terlihat bekerja (data sering tidak berubah) */
async function muatUlang(e) {
  const b = e && e.currentTarget; if (b) { b.disabled = true; b.textContent = 'Memuat…'; }
  let ok;
  try { ok = await load(true); } catch (err) { ok = false; flash = { ok: false, text: 'Tidak bisa terhubung ke server. Periksa koneksi lalu coba lagi.' }; render(); }
  const jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  if (ok !== false && !flash) { const el = document.getElementById('reload'); if (el) { el.textContent = '✓ Diperbarui ' + jam; setTimeout(() => { if (el.isConnected) el.textContent = 'Muat ulang'; }, 4000); } }
}
async function load(fresh) {
  if (!auth) return renderLogin();
  fresh = fresh === true;
  if (!auth.peran || auth.lokasi === undefined) {
    const r = await api({ action: 'adminLogin', staffId: auth.staffId, pin: auth.pin });
    if (!r.ok) return logout();
    auth.peran = r.staff.peran; auth.lokasi = r.staff.lokasi || ''; store.set('oms_admin', JSON.stringify(auth));
  }
  $('#who').innerHTML = `<span class="who">${esc(auth.nama)} · ${esc(auth.peran)}</span> <button id="out">Keluar</button>`;
  $('#out').onclick = logout;
  renderTabs();
  const loading = m => { if (!$('#main').children.length || $('#main .msg')) $('#main').innerHTML = `<div class="msg">${m}</div>`; };
  let r;
  if (view === 'produksi') {
    loading('Memuat daftar kerja…');
    r = await api({ action: 'adminProduction', staffId: auth.staffId, pin: auth.pin, fresh });
    if (r.ok) { prodData = r; today = r.hariIni; }
  } else if (view === 'pengiriman') {
    loading('Memuat pengiriman…');
    const [a, l] = await Promise.all([
      api({ action: 'adminShipments', staffId: auth.staffId, pin: auth.pin, status: shipFilter, tanggal: shipDate, fresh }),
      api({ action: 'adminLots', staffId: auth.staffId, pin: auth.pin })]);
    r = a;
    if (r.ok) { shipData = r.shipments; couriers = r.couriers; today = r.hariIni; ruteKurir = r.ruteKurir || {}; lokUtama = r.lokasiUtama || lokUtama; alurPindah = r.alurPindah !== false; }
    if (l.ok) lotData = l;
  } else if (view === 'kode') {
    loading('Memuat stok kode produksi…');
    r = await api({ action: 'adminLots', staffId: auth.staffId, pin: auth.pin });
    if (r.ok) { lotData = r; today = r.hariIni; }
  } else if (view === 'tagihan') {
    loading('Memuat tagihan…');
    const [a, p] = await Promise.all([api({ action: 'adminInvoices', staffId: auth.staffId, pin: auth.pin, fresh }), api({ action: 'adminPayments', staffId: auth.staffId, pin: auth.pin })]);
    r = a.ok ? p : a;
    if (a.ok && p.ok) { tgInv = a; tgPay = p; today = a.hariIni; tgBadge = p.menunggu.length; renderTabs(); }
  } else if (view === 'laporan') {
    loading('Menyusun laporan…');
    if (!repBulan) repBulan = new Date(Date.now() + 8 * 36e5).toISOString().slice(0, 7);
    r = await api({ action: 'adminReport', staffId: auth.staffId, pin: auth.pin, jenis: repJenis, bulan: repBulan, fresh });
    if (r.ok) repData = r;
  } else {
    if (!all.length) loading('Memuat pesanan…');
    r = await api({ action: 'adminOrders', staffId: auth.staffId, pin: auth.pin, fresh });
    if (r.ok) { all = r.orders; today = r.hariIni; }
  }
  if (!r.ok) { if (/PIN|Staff tidak/.test(r.error)) return logout(); $('#main').innerHTML = `<div class="msg err">${esc(r.error)}</div>`; return false; }
  render();
  return true;
}

function renderTabs() {
  const tabs = [['pesanan', 'Pesanan']].concat(canShip() ? [['produksi', 'Produksi'], ['kode', 'Kode'], ['pengiriman', 'Pengiriman'], ['laporan', 'Laporan']] : [])
    .concat(isAdmin() ? [['tagihan', 'Tagihan' + (tgBadge ? ' (' + tgBadge + ')' : '')]] : []);
  $('#tabs').innerHTML = tabs.map(([v, l]) => `<button class="tab${view === v ? ' on' : ''}" data-view="${v}">${l}</button>`).join('');
}

function progressText(i) {
  const bits = [];
  if (i.terkirim) bits.push(i.terkirim + ' terkirim');
  if (i.dijadwalkan - i.terkirim > 0) bits.push((i.dijadwalkan - i.terkirim) + ' dijadwalkan');
  if (i.ditutup) bits.push(i.ditutup + ' ditutup');
  return bits.length ? ` <span class="sub">· ${bits.join(' · ')}</span>` : '';
}

const billed = o => { const t = (o.pengiriman || []).filter(x => x.status === 'TERKIRIM'); return t.length ? t.reduce((s, x) => s + x.total, 0) : null; };

function shipMini(x) {
  return `<div class="ship-mini"><span>${esc(x.id)} · ${esc(tgl(x.tglRencana))} · ${x.items.map(i => i.qty + '× ' + esc(i.nama)).join(', ')}</span>
    <span class="status st-${esc(x.status)}">${esc(x.statusLabel)}</span></div>`;
}

function card(o) {
  const soon = o.status === 'MASUK' && o.tglKirim <= today;
  const items = o.items.map(i => `<div><span>${i.qty} × ${esc(i.nama)}${progressText(i)}</span><span class="sub">${i.harga ? rp(i.qty * i.harga) : '<span class="lotnone">harga belum diisi</span>'}</span></div>`).join('');
  const sisa = o.items.reduce((s, i) => s + i.sisa, 0);
  const jalan = ['DIVALIDASI'].concat(BERJALAN).includes(o.status);
  let actions = '';
  if (isAdmin() && o.status === 'MASUK') actions = `<button class="btn ok" data-validate="${esc(o.id)}">Validasi</button><button class="btn sec" data-edit="${esc(o.id)}">Ubah</button><button class="btn ghost" data-cancel="${esc(o.id)}">Batalkan</button>`;
  if (canShip() && jalan && sisa > 0) actions += `<button class="btn" data-ship="${esc(o.id)}">+ Pengiriman</button>`;
  if (isAdmin() && o.status === 'DIVALIDASI') actions += `<button class="btn sec" data-edit="${esc(o.id)}">Ubah</button><button class="btn ghost" data-cancel="${esc(o.id)}">Batalkan</button>`;
  if (isAdmin() && BERJALAN.includes(o.status) && sisa > 0) actions += `<button class="btn ghost" data-close="${esc(o.id)}">Tutup sisa</button>`;
  return `<div class="card order${soon ? ' soon' : ''}${o._pending ? ' pending' : ''}" id="o-${esc(o.id)}">
    <div class="head"><div class="name">${esc(o.customer)}</div><span class="status st-${esc(o.tampil || o.status)}">${esc(o.statusLabel)}</span></div>
    <div class="sub">${esc(o.id)} · ${esc(o.customerId)} · dipesan ${esc(o.tglOrder)}</div>
    <div style="margin:2px 0">${ruteTag(o)}</div>
    ${o.kredit ? `<div class="kreditwarn">⚠ ${esc(o.kredit.alasan)} · piutang ${rp(o.kredit.piutang)}${o.kredit.mode === 'Lunak' ? ' — periksa sebelum validasi' : ''}</div>` : ''}
    <div class="sub"><b style="color:var(--ink)">Kirim ${esc(tgl(o.tglKirim))}</b>${soon ? ' · <span style="color:var(--warn)">hari ini / terlambat</span>' : ''}</div>
    <div class="items">${items}</div>
    <div class="total"><span>Total pesanan</span><span>${rp(o.total)}</span></div>
    ${billed(o) !== null ? `<div class="sub" style="display:flex;justify-content:space-between"><span>Sudah terkirim (ditagih)</span><span>${rp(billed(o))}</span></div>` : ''}
    ${o.pengiriman && o.pengiriman.length ? `<div class="ships">${o.pengiriman.map(shipMini).join('')}</div>` : ''}
    ${o.catatan ? `<div class="sub" style="margin-top:6px">Catatan: ${esc(o.catatan)}</div>` : ''}
    ${o.divalidasiOleh ? `<div class="sub">Divalidasi oleh ${esc(o.divalidasiOleh)}</div>` : ''}
    ${o.alasanTutup ? `<div class="sub">Alasan: ${esc(o.alasanTutup)}</div>` : ''}
    ${o.dibuatOleh && o.dibuatOleh.indexOf('Admin') === 0 ? `<div class="sub">Diinput admin oleh ${esc(o.dibuatOleh.replace(/^Admin: /, ''))}</div>` : ''}
    ${o.riwayatUbah ? `<div class="hist">Diubah: ${esc(o.riwayatUbah)}</div>` : ''}
    <div class="actions" data-box="${esc(o.id)}">${actions}</div>
  </div>`;
}

function render() {
  if (view === 'produksi') return renderProduksi();
  if (view === 'pengiriman') return renderPengiriman();
  if (view === 'kode') return renderKode();
  if (view === 'laporan') return renderLaporan();
  if (view === 'tagihan') return renderTagihan();
  const match = (o, s) => !s || (s === 'BERJALAN' ? BERJALAN.includes(o.status) : o.status === s);
  const count = s => all.filter(o => match(o, s)).length;
  const ql = q.toLowerCase();
  const list = all.filter(o => match(o, filter) && (!ql || (o.customer + ' ' + o.id + ' ' + o.customerId).toLowerCase().includes(ql)))
    .sort((a, b) => filter === 'MASUK' ? a.tglKirim.localeCompare(b.tglKirim) : 0);
  $('#main').innerHTML = `
    ${flash ? `<div class="alert ${flash.ok ? 'ok' : 'bad'}">${esc(flash.text)}</div>` : ''}
    <div class="filters">
      ${isAdmin() ? '<button class="btn" id="newOrder">+ Order baru</button>' : ''}
      ${FILTERS.map(([s, l]) => `<button class="chip${filter === s ? ' on' : ''}" data-f="${s}">${l}<b>${count(s)}</b></button>`).join('')}
      <span class="grow"></span>
      <input id="q" placeholder="Cari customer / ID" value="${esc(q)}" style="max-width:220px">
      <button class="chip" id="reload">Muat ulang</button>
    </div>
    ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<div class="msg">Tidak ada pesanan di sini.</div>'}`;
  flash = null;
  $('#q').oninput = e => { q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); };

  if ($('#newOrder')) $('#newOrder').onclick = () => openForm(null);
}

/* ---------- Form order baru / ubah order ---------- */
let customers = null, form = null;

async function openForm(orderId) {
  const o = orderId ? all.find(x => x.id === orderId) : null;
  form = { order: o, customer: null, katalog: [], qty: {}, ref: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()), search: '' };
  window.scrollTo(0, 0);
  if (o) { await pickCustomer(o.customerId); return; }
  renderForm();
  if (!customers) {
    const r = await api({ action: 'adminCustomers', staffId: auth.staffId, pin: auth.pin });
    if (!r.ok) return formError(r.error);
    customers = r.customers;
    if (form && !form.customer) renderForm();
  }
}

async function pickCustomer(cid) {
  $('#main').innerHTML = '<div class="msg">Memuat katalog…</div>';
  const r = await api({ action: 'adminCatalog', staffId: auth.staffId, pin: auth.pin, customerId: cid });
  if (!r.ok) return formError(r.error);
  form.customer = r.customer;
  form.katalog = r.katalog.slice();
  form.orig = {};
  if (form.order) {
    form.order.items.forEach(i => {
      form.qty[i.productId] = i.qty; form.orig[i.productId] = i.qty;
      const k = form.katalog.find(p => p.id === i.productId);
      if (k) k.harga = i.harga; // item yang sudah ada tetap memakai harga saat dipesan
      else form.katalog.push({ id: i.productId, nama: i.nama, harga: i.harga, luarKatalog: true });
    });
  }
  renderForm();
}

function formError(msg) { $('#main').innerHTML = `<div class="form"><div class="alert bad">${esc(msg)}</div><button class="btn sec" id="cancelForm">← Kembali</button></div>`; $('#cancelForm').onclick = closeForm; }
function closeForm() { form = null; render(); }

function formTotal() { return form.katalog.reduce((s, p) => s + (form.qty[p.id] || 0) * p.harga, 0); }

function renderForm() {
  const o = form.order, c = form.customer;
  let body;
  if (!c) {
    const ql = form.search.toLowerCase();
    const hits = customers ? customers.filter(x => !ql || (x.nama + ' ' + x.id).toLowerCase().includes(ql)).slice(0, 8) : [];
    body = `<p class="label-sec">1. Pilih customer</p>
      <input id="cs" placeholder="Ketik nama atau ID customer (mis. C-012)" value="${esc(form.search)}" autocomplete="off">
      ${!customers ? '<p class="sub">Memuat daftar customer…</p>' : hits.length ? `<div class="picks">${hits.map(x => `<button data-pick="${esc(x.id)}"><span>${esc(x.nama)}</span><span class="sub">${esc(x.id)}${x.katalog ? '' : ' · belum ada price list'}</span></button>`).join('')}</div>` : '<p class="sub">Tidak ditemukan.</p>'}`;
  } else {
    const rows = form.katalog.length ? form.katalog.map(p => {
      const q = form.qty[p.id] || 0, changed = o && (form.orig[p.id] || 0) !== q;
      return `<div class="row"><div><div class="name">${esc(p.nama)}</div><div class="sub">${rp(p.harga)}${p.hargaKhusus ? ' · harga khusus' : ''}${p.luarKatalog ? ' · sudah tidak di price list' : ''}</div></div>
        <div class="stepper"><button data-dec="${esc(p.id)}">−</button><input inputmode="numeric" data-q="${esc(p.id)}" value="${q}" class="${changed ? 'changed' : ''}"><button data-inc="${esc(p.id)}">+</button></div></div>`;
    }).join('') : '<p class="sub">Customer ini belum punya price list. Tambahkan produknya di tab PriceList dulu.</p>';
    const tglMin = today;
    const tgl0 = o ? o.tglKirim : new Date(new Date(today + 'T12:00:00+08:00').getTime() + 864e5).toISOString().slice(0, 10);
    body = `<p class="label-sec">${o ? 'Isi pesanan' : '2. Isi pesanan'}</p>${rows}
      <label for="ftk">Tanggal kirim</label><input type="date" id="ftk" min="${o && o.tglKirim < tglMin ? o.tglKirim : tglMin}" value="${esc(form.tgl || tgl0)}">
      <label for="fct">Catatan</label><textarea id="fct" rows="2" maxlength="300" placeholder="Mis. order via WA dari Pak Made">${esc(form.cat !== undefined ? form.cat : (o ? o.catatan : ''))}</textarea>
      ${o ? (o.status === 'DIVALIDASI' ? '<p class="sub" style="margin-top:10px">Pesanan ini sudah divalidasi. Customer melihat perubahan di halamannya; kabari customer bila jumlah berubah.</p>' : '')
          : `<label class="check"><input type="checkbox" id="fval" ${form.val === false ? '' : 'checked'}><span>Langsung validasi<br><span class="sub">Centang bila jumlah & tanggal sudah dikonfirmasi dengan customer.</span></span></label>`}`;
  }
  $('#main').innerHTML = `<div class="form">
    <div class="card">
      <h2>${o ? 'Ubah ' + esc(o.id) : 'Order baru'}</h2>
      <p class="sub" style="margin:0 0 12px">${c ? `${esc(c.nama)} · ${esc(c.id)} ${o ? '' : '<button class="chip" id="chg" style="margin-left:6px;padding:2px 10px">Ganti</button>'}` : 'Untuk pesanan yang masuk lewat WA atau telepon.'}</p>
      <div id="fbody">${body}</div>
    </div>
    <div class="savebar"><button class="btn sec" id="cancelForm">Batal</button>
      ${c ? `<div><span class="sub">Total </span><b id="ftot">${rp(formTotal())}</b></div><button class="btn" id="saveForm">${o ? 'Simpan perubahan' : 'Simpan order'}</button>` : ''}</div>
  </div>`;
  $('#cancelForm').onclick = closeForm;
  if (!c && $('#cs')) { const i = $('#cs'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); i.oninput = e => { form.search = e.target.value; renderForm(); }; }
  if ($('#chg')) $('#chg').onclick = () => { form.customer = null; form.qty = {}; renderForm(); };
  if ($('#saveForm')) $('#saveForm').onclick = saveForm;
  ['#ftk', '#fct'].forEach(s => { if ($(s)) $(s).oninput = () => { form.tgl = $('#ftk').value; form.cat = $('#fct').value; }; });
  if ($('#fval')) $('#fval').onchange = e => { form.val = e.target.checked; };
}

function setFormQty(id, q) {
  q = Math.max(0, Math.min(999, Math.floor(Number(q) || 0)));
  form.qty[id] = q;
  const inp = document.querySelector(`input[data-q="${id}"]`);
  if (inp) { if (Number(inp.value) !== q) inp.value = q; inp.classList.toggle('changed', !!form.order && (form.orig[id] || 0) !== q); }
  if ($('#ftot')) $('#ftot').textContent = rp(formTotal());
}

async function saveForm() {
  const btn = $('#saveForm');
  const items = form.katalog.map(p => ({ productId: p.id, qty: form.qty[p.id] || 0 }));
  const base = { staffId: auth.staffId, pin: auth.pin, tglKirim: $('#ftk').value, catatan: $('#fct').value };
  let body;
  if (form.order) {
    body = Object.assign(base, { action: 'adminEditOrder', orderId: form.order.id, items: items.filter(i => i.qty > 0 || form.orig[i.productId]) });
  } else {
    const isi = items.filter(i => i.qty > 0);
    if (!isi.length) return showFormMsg('Isi minimal 1 produk.');
    body = Object.assign(base, { action: 'adminCreateOrder', customerId: form.customer.id, ref: form.ref, validasi: $('#fval').checked, items: isi });
  }
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  let r;
  try { r = await api(body); } catch (e) { r = { ok: false, error: 'Koneksi terputus. Coba simpan lagi; order tidak akan tercatat dobel.' }; }
  if (!r.ok) { btn.disabled = false; btn.textContent = form.order ? 'Simpan perubahan' : 'Simpan order'; return showFormMsg(r.error); }
  flash = { ok: true, text: r.unchanged ? 'Tidak ada perubahan.' : (form.order ? r.order.id + ' diperbarui. Total ' + rp(r.order.total) + '.' : 'Order ' + r.order.id + ' untuk ' + form.customer.nama + ' tersimpan (' + r.order.statusLabel + ').') };
  filter = r.order.status;
  form = null;
  await load();
  window.scrollTo(0, 0);
}

function showFormMsg(msg) {
  const old = document.querySelector('.form .alert'); if (old) old.remove();
  document.querySelector('.form').insertAdjacentHTML('afterbegin', `<div class="alert bad">${esc(msg)}</div>`);
  window.scrollTo(0, 0);
}

/* ---------- Produksi ---------- */
/* Saran kode produksi per pesanan: kemasan dengan kode tertua dipakai dulu, berurutan sesuai daftar (sama dengan aturan server saat Siap kirim). */
let saranMap = {}, urutIds = [];
function hitungSaran(d, urutOrder) {
  const sisa = {};
  Object.keys(d.stokKode || {}).forEach(pid => { sisa[pid] = d.stokKode[pid].map(k => ({ lot: k.lot, n: k.sisa })); });
  saranMap = {};
  urutOrder.forEach(o => {
    saranMap[o.id] = o.items.filter(i => i.sisa > 0 && !(d.nonKopi || []).includes(i.productId) && (!prodLok || i.lokasi === prodLok)).map(i => {
      let need = i.sisa; const ambil = [];
      (sisa[i.productId] || []).forEach(k => { if (need > 0 && k.n > 0) { const t = Math.min(need, k.n); ambil.push({ lot: k.lot, q: t }); k.n -= t; need -= t; } });
      return { nama: i.nama, ambil, kurang: need };
    });
  });
}
function saranHTML(o) {
  const s = saranMap[o.id] || [];
  if (!s.length) return '';
  return `<div class="saran">${s.map(x => `<div>${esc(x.nama)}: ${x.ambil.map(a => `<span class="lotcode">${esc(a.lot)}</span> ×${a.q}`).join(' + ')}${x.kurang > 0 ? `${x.ambil.length ? ' + ' : ''}<span class="lotnone">${x.kurang} belum ada kemasan berkode</span>` : ''}</div>`).join('')}</div>`;
}

/* Status bagian lokasi lain dalam pesanan campuran */
function lokTag(o, x, netral) {
  const d = prodData, t = o.siapLokasi || [], U = d.lokasiUtama;
  if (x !== U && d.alurPindah) {
    if (t.includes(x + '>' + U)) return `<span class="loktag ok">✓ ${esc(x)} sudah di ${esc(U)}</span>`;
    if (t.includes(x)) return `<span class="loktag">${esc(x)} siap · belum diambil kurir</span>`;
    return `<span class="loktag">${netral ? esc(x) : 'menunggu ' + esc(x)}</span>`;
  }
  return t.includes(x) ? `<span class="loktag ok">✓ ${esc(x)} siap</span>` : `<span class="loktag">${netral ? esc(x) : 'menunggu ' + esc(x)}</span>`;
}
/* Lokasi utama: kotak "Terima barang dari HB" */
function terimaHTML(d, L) {
  if (!d.alurPindah || (L && L !== d.lokasiUtama)) return '';
  const U = d.lokasiUtama;
  const list = d.orders.filter(o => (o.siapLokasi || []).some(t => t !== U && !t.includes('>') && !(o.siapLokasi || []).includes(t + '>' + U)));
  if (!list.length) return '';
  return `<div class="card" style="margin-bottom:14px;border:2px solid #e8b923">
    <h3 style="margin:0 0 4px">Barang siap di lokasi lain, belum diambil</h3>
    <p class="sub" style="margin:0 0 8px">Biasanya <b>otomatis</b>: begitu kurir menekan <b>Sudah diambil</b> di aplikasi Delivery, pesanan jadi Siap dikirim (bila bagian ${esc(U)} juga siap). Tekan <b>Terima manual</b> hanya bila barang dibawa orang lain tanpa aplikasi.</p>

      return head + `<div class="row${on ? ' picked' : ''}"><label class="ckrow"><input type="checkbox" class="ck" data-po="${esc(o.id)}" ${on ? 'checked' : ''}>
        <div><div class="name">${esc(o.customer)}</div>

async function bulkShip() {
  // Urut sesuai daftar supaya kode yang dipakai server sama dengan saran di layar
  const ids = [...prodPick].sort((a, b) => urutIds.indexOf(a) - urutIds.indexOf(b)); if (!ids.length || busy) return;
  // Dari tampilan "Semua": pesanan campuran dianggap siap di SEMUA lokasi. Minta konfirmasi supaya bagian HB tidak terlewat.
  if ((prodData.lokasiList || []).length > 1 && !prodLok) {
    const campur = ids.map(id => prodData.orders.find(o => o.id === id)).filter(o => o && new Set(o.items.filter(i => i.sisa > 0).map(i => i.lokasi)).size > 1);
    if (campur.length && !confirm(campur.length + ' pesanan berisi barang dari beberapa lokasi:\n' + campur.map(o => '• ' + o.customer + ' (' + [...new Set(o.items.filter(i => i.sisa > 0).map(i => i.lokasi))].join(' + ') + ')').join('\n') + '\n\nMenandai dari "Semua" berarti barang di SEMUA lokasi sudah siap. Lanjut?')) return;
  }
  // Layar langsung berubah: pesanan yang dicentang hilang dari daftar kerja, server menyusul
  const before = JSON.stringify(prodData);
  prodData.hari.forEach(h => { h.produk.forEach(p => { p.rincian = p.rincian.filter(r => !ids.includes(r.orderId)); p.qty = p.rincian.reduce((a, r) => a + r.qty, 0); }); h.produk = h.produk.filter(p => p.rincian.length); });
  prodData.hari = prodData.hari.filter(h => h.produk.length);
  prodPick = new Set(); busy = true; keepScroll(renderProduksi);
  let r;
  try { r = await api({ action: 'adminBulkShip', staffId: auth.staffId, pin: auth.pin, ref: uid(), orderIds: ids, lokasi: ((prodData.lokasiList || []).length > 1 && prodLok) || '' }); }
  catch (e) { r = { ok: false, error: 'Koneksi terputus. Coba lagi; tidak akan tercatat dobel.' }; }
  busy = false;
  if (!r.ok) { prodData = JSON.parse(before); ids.forEach(id => prodPick.add(id)); flash = { ok: false, text: r.error }; return keepScroll(renderProduksi); }
  const bad = r.results.filter(x => !x.ok);
  const tunggu = r.results.filter(x => x.ok && x.menunggu);
  if (prodLok && prodData.alurPindah && prodLok !== prodData.lokasiUtama) {
    flash = { ok: !bad.length, text: r.berhasil + ' pesanan siap di ' + prodLok + '. Sekarang muncul di aplikasi kurir (Ambil di ' + prodLok + ') untuk dibawa ke ' + prodData.lokasiUtama + '.' + (bad.length ? ' Gagal: ' + bad.map(x => x.orderId + ' (' + x.error + ')').join(', ') : '') };
    return load();
  }
  flash = { ok: !bad.length, text: (r.berhasil - tunggu.length) + ' pesanan siap dikirim.' + (tunggu.length ? ' ' + tunggu.length + ' pesanan menunggu: ' + [...new Set(tunggu.flatMap(x => x.menunggu))].join(' & ') + '.' : '') + (bad.length ? ' Gagal: ' + bad.map(x => x.orderId + ' (' + x.error + ')').join(', ') : '') };
  load();
}
const keepScroll = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };

function lotLine(x, i) {
  const lots = [];
  (i.lots || []).forEach(l => { const x = lots.find(y => y.lot === l.lot); if (x) x.qty += l.qty; else lots.push(Object.assign({}, l)); });
  if (!lots.length) return '';
  const editable = (i.lots || []).length === 1 && x.status !== 'BATAL' && x.status !== 'TERKIRIM' && !x._pending;
  if (editable) {
    const cur = lots[0].lot;
    const opts = ((lotData && lotData.lots) || []).filter(l => l.productId === i.productId && l.lot !== cur && l.sisa >= i.qty);
    return `<div class="lotline">Kode: <select data-setlot="${esc(x.id)}" data-item="${esc(i.itemId)}">
      <option value="${esc(cur)}">${cur ? esc(cur) : '⚠ belum ada kode'}</option>
      ${opts.map(l => `<option value="${esc(l.lot)}">${esc(l.lot)} (stok ${l.sisa}, exp ${esc(l.exp)})</option>`).join('')}
      ${cur ? '<option value="">(kosongkan)</option>' : ''}</select></div>`;
  }
  return `<div class="lotline">Kode: ${lots.map(l => l.lot ? `<span class="lotcode">${esc(l.lot)}</span>${lots.length > 1 ? ' ×' + l.qty : ''}` : `<span class="lotnone">belum ada kode${lots.length > 1 ? ' ×' + l.qty : ''}</span>`).join(' · ')}</div>`;
}

  let r;
  try { r = await api({ action: 'adminSetLot', staffId: auth.staffId, pin: auth.pin, shipmentId: shipId, itemId, lotId }); }
  catch (e) { r = { ok: false, error: 'Koneksi terputus. Coba lagi.' }; }
  if (r.ok && r.shipment) { const k = shipData.findIndex(y => y.id === shipId); if (k >= 0) shipData[k] = r.shipment; }
  flash = r.ok ? { ok: true, text: shipId + ': kode produksi ' + (lotId || 'dikosongkan') + '.' } : { ok: false, text: r.error };
  const l = await api({ action: 'adminLots', staffId: auth.staffId, pin: auth.pin });
  if (l.ok) lotData = l;
  keepScroll(renderPengiriman);
}

/* ---------- Kode produksi: wadah (batch) → kemas → label ---------- */

const netto = g => !g ? '1 kg' : g >= 1000 ? (g / 1000) + ' kg' : g + ' g';

    </div>`).join('');
  $('#main').innerHTML = `${flash ? `<div class="alert ${flash.ok ? 'ok' : 'bad'}">${esc(flash.text)}</div>` : ''}

      ${bt ? `<label for="pt">Tanggal kemas</label><input type="date" id="pt" value="${esc(pf.tglKemas)}" min="${esc(bt.tglRoast)}" max="${esc(d.hariIni)}">
        <p class="label-sec" style="margin-top:14px">Jumlah dikemas</p>

async function saveBatch() {
  const f = batchForm;
  if (!f.jenis) { flash = { ok: false, text: 'Pilih jenis kopi.' }; return renderKode(); }
  if (!(Number(String(f.kg).replace(',', '.')) > 0)) { flash = { ok: false, text: 'Isi berat di wadah (kg).' }; return renderKode(); }
  busy = true; $('#saveBatch').disabled = true; $('#saveBatch').textContent = 'Menyimpan…';
  let r;
  try { r = await api({ action: 'adminBatchCreate', staffId: auth.staffId, pin: auth.pin, ref: f.ref, jenis: f.jenis, tglRoast: f.tglRoast, kg: f.kg, kgGreen: f.kgGreen, catatan: f.catatan }); }
  catch (e) { r = { ok: false, error: 'Koneksi terputus. Coba simpan lagi; tidak akan tercatat dobel.' }; }
  busy = false;
  if (!r.ok) { flash = { ok: false, text: r.error }; return renderKode(); }
  lotDone = Object.assign({ type: 'batch' }, r);
  batchForm = null; packForm = { ref: uid(), lotId: r.lot, tglKemas: lotData.hariIni, qty: {}, habis: false, catatan: '' };
  await load(); window.scrollTo(0, 0);
}

async function savePack() {
  const f = packForm;
  document.querySelectorAll('[data-pq]').forEach(inp => { f.qty[inp.dataset.pq] = inp.value.trim(); });
  const items = Object.keys(f.qty).map(id => ({ productId: id, qty: f.qty[id] })).filter(x => Number(String(x.qty).replace(',', '.')) > 0);
  if (!items.length) { flash = { ok: false, text: 'Isi jumlah yang dikemas.' }; return renderKode(); }
  busy = true; $('#savePack').disabled = true; $('#savePack').textContent = 'Menyimpan…';
  let r;
  try { r = await api({ action: 'adminPackCreate', staffId: auth.staffId, pin: auth.pin, ref: f.ref, lotId: f.lotId, tglKemas: f.tglKemas, items, habis: f.habis, catatan: f.catatan }); }
  catch (e) { r = { ok: false, error: 'Koneksi terputus. Coba simpan lagi; tidak akan tercatat dobel.' }; }
  busy = false;
  if (!r.ok) { flash = { ok: false, text: r.error }; return renderKode(); }
  if (r.duplicate) { flash = { ok: true, text: 'Sudah tersimpan sebelumnya.' }; packForm = null; return load(); }
  lotDone = Object.assign({ type: 'pack' }, r);
  packForm = { ref: uid(), lotId: r.habis ? '' : f.lotId, tglKemas: f.tglKemas, qty: {}, habis: false, catatan: '' };
  await load(); window.scrollTo(0, 0);
}

/* ---------- Cetak label ---------- */
function labelSize() { return store.get('oms_label') || 'roll'; }
function printLabels(html) {
  const sz = labelSize();
  let area = document.getElementById('printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  let ps = document.getElementById('pageStyle');
  if (!ps) { ps = document.createElement('style'); ps.id = 'pageStyle'; document.head.appendChild(ps); }
  ps.textContent = sz === 'roll' ? '@page { size: 50mm 30mm; margin: 0; }' : '@page { size: A4; margin: 10mm 7mm; }';
  area.className = 'sz-' + sz;
  area.innerHTML = html;
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(done, 500); }, 50);
}
function labelProduk(lot, pid, n) {
  const b = lotData.batches.find(x => x.lot === lot);
  const j = lotData.jenis.find(x => x.jenis === (b && b.jenis));
  const p = (j && j.produk.find(x => x.id === pid)) || { nama: ((b && b.stok.find(x => x.productId === pid)) || {}).nama || pid, gram: '' };
  if (!b) return;
  n = Math.max(1, Math.min(1000, Math.floor(Number(n) || 0)));
  const one = `<div class="lbl">${lotData.namaLabel ? `<div class="co">${esc(lotData.namaLabel)}</div>` : ''}
    <div class="pn">${esc(p.nama)}</div>
    <div class="kd">${esc(lot)}</div>
    <div class="ln">Tgl produksi: ${esc(fmtD(b.tglRoast))}<br>Baik digunakan sebelum: ${esc(fmtD(b.exp))}<br>Netto: ${esc(netto(p.gram))}</div></div>`;
  printLabels(one.repeat(n));
}
function labelWadah(lot) {
  const b = lotData.batches.find(x => x.lot === lot) || (lotDone && lotDone.lot === lot ? lotDone : null);
  if (!b) return;
  printLabels(`<div class="lbl wadah"><div class="co">WADAH · ${esc(b.jenis)}</div><div class="kd">${esc(lot)}</div>
    <div class="ln">Roast: ${esc(fmtD(b.tglRoast))} · ${b.kg} kg<br>EXP: ${esc(fmtD(b.exp))}</div></div>`);
}

const tglPendek = s => { const d = new Date(String(s).slice(0, 10) + 'T12:00:00+08:00'); return isNaN(d) ? s : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: '2-digit' }); };
const unduhCsv = (nama, header, rows) => {
  const q = v => { const t = String(v ?? ''); return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const txt = [header.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' })); a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
};

async function shipUpdate(id, extra, okText) {
  // Layar langsung berubah; server menyusul
  const x = shipData && shipData.find(y => y.id === id);
  if (x) {
    if (extra.status) { x.status = extra.status; x.statusLabel = SHIP_LABEL[extra.status] || extra.status; }
    if (extra.kurirId !== undefined) { x.kurirId = extra.kurirId; const k = couriers.find(c => c.id === extra.kurirId); x.kurir = k ? k.nama : ''; }
    if (extra.invoiceNo !== undefined) x.invoiceNo = extra.invoiceNo;
    if (extra.tglRencana !== undefined) x.tglRencana = extra.tglRencana;
    x._pending = true; keepScroll(renderPengiriman);
  }
  let r;
  try { r = await api(Object.assign({ action: 'adminShipmentUpdate', staffId: auth.staffId, pin: auth.pin, shipmentId: id }, extra)); }
  catch (e) { r = { ok: false, error: 'Koneksi terputus. Coba lagi.' }; }
  if (r.ok && r.shipment && shipData) { const i = shipData.findIndex(y => y.id === id); if (i >= 0) shipData[i] = r.shipment; }
  flash = r.ok ? { ok: true, text: r.unchanged ? 'Tidak ada perubahan.' : okText.replace('{id}', id) } : { ok: false, text: r.error };
  if (!r.ok) return load();
  keepScroll(renderPengiriman);
}

async function bulkReady() {
  const ids = [...shipPick]; if (!ids.length || busy) return;
  shipData.forEach(x => { if (ids.includes(x.id)) { x.status = 'SIAP_KIRIM'; x.statusLabel = 'Siap dikirim'; x._pending = true; } });
  shipPick = new Set(); busy = true; keepScroll(renderPengiriman);
  let r;
  try { r = await api({ action: 'adminShipmentBulk', staffId: auth.staffId, pin: auth.pin, shipmentIds: ids, status: 'SIAP_KIRIM' }); }
  catch (e) { r = { ok: false, error: 'Koneksi terputus. Coba lagi.' }; }
  busy = false;
  const bad = r.ok ? r.results.filter(x => !x.ok) : [];
  flash = r.ok ? { ok: !bad.length, text: r.berhasil + ' pengiriman siap dikirim.' + (bad.length ? ' Gagal: ' + bad.map(x => x.shipmentId + ' (' + x.error + ')').join(', ') : '') } : { ok: false, text: r.error };
  load();
}

  }
  if (t.dataset.lsz) { store.set('oms_label', t.dataset.lsz); keepScroll(renderKode); }
  if (t.dataset.plwadah) labelWadah(t.dataset.plwadah);
  if (t.dataset.plprod) labelProduk(t.dataset.plprod, t.dataset.pid, t.dataset.n === 'ask' ? ($('#lbln') || {}).value : t.dataset.n);
  if (t.dataset.labelfor) { const [lot, pid] = t.dataset.labelfor.split('|'); const b = lotData.batches.find(x => x.lot === lot); const st = b && b.stok.find(x => x.productId === pid); labelFor = { lot, pid, n: st ? Math.ceil(st.sisa || st.qty) : 1 }; keepScroll(renderKode); }
  if (t.dataset.closebatch) {
    if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Yakin? Klik lagi'; return; }
    t.disabled = true;
    api({ action: 'adminBatchClose', staffId: auth.staffId, pin: auth.pin, lotId: t.dataset.closebatch }).then(r => {
      flash = r.ok ? { ok: true, text: 'Wadah ' + r.lot + ' ditandai habis.' } : { ok: false, text: r.error }; load();
    });
  }
  if (t.dataset.sg) { shipGroup = t.dataset.sg; render(); }
  if (t.dataset.sday !== undefined) { shipDate = t.dataset.sday; load(); }
  if (t.dataset.next) {
    const to = t.dataset.to;
    if (to === 'TERKIRIM' && t.dataset.confirm !== '1') {
      const box = document.querySelector(`[data-sbox="${t.dataset.next}"]`);
      box.innerHTML = `<input placeholder="Nama penerima (opsional)" id="pn-${esc(t.dataset.next)}"><button class="btn ok" data-next="${esc(t.dataset.next)}" data-to="TERKIRIM" data-confirm="1">Simpan terkirim</button>`;
      return;
    }
    t.disabled = true; t.textContent = 'Memproses…';
    const pn = document.getElementById('pn-' + t.dataset.next);
    shipUpdate(t.dataset.next, { status: to, penerima: pn ? pn.value.trim() : '' }, '{id}: status diperbarui.');
  }
  if (t.dataset.kirimhariini) { t.disabled = true; shipUpdate(t.dataset.kirimhariini, { tglRencana: today }, '{id}: dipindah ke hari ini, langsung muncul di daftar muat kurir.'); }
  if (t.dataset.saveinv) { t.disabled = true; shipUpdate(t.dataset.saveinv, { invoiceNo: document.querySelector(`[data-inv="${t.dataset.saveinv}"]`).value.trim() }, '{id}: no. invoice disimpan.'); }
  if (t.dataset.scancel) {
    const box = document.querySelector(`[data-sbox="${t.dataset.scancel}"]`);
    box.innerHTML = `<input placeholder="Alasan pembatalan (wajib)" id="sal-${esc(t.dataset.scancel)}"><button class="btn ghost" data-sdocancel="${esc(t.dataset.scancel)}">Batalkan pengiriman</button>`;
    box.querySelector('input').focus();
  }
  if (t.dataset.sdocancel) {
    const al = document.getElementById('sal-' + t.dataset.sdocancel).value.trim();
    if (!al) { document.getElementById('sal-' + t.dataset.sdocancel).placeholder = 'Alasan wajib diisi'; return; }
    t.disabled = true; shipUpdate(t.dataset.sdocancel, { status: 'BATAL', alasan: al }, '{id} dibatalkan; qty kembali ke daftar kerja produksi.');
  }
  if (t.dataset.close) {
    const box = document.querySelector(`[data-box="${t.dataset.close}"]`);
    box.innerHTML = `<input placeholder="Alasan sisa tidak dikirim (wajib), mis. green bean tidak datang" id="cl-${esc(t.dataset.close)}">
      <button class="btn ghost" data-doclose="${esc(t.dataset.close)}">Tutup sisa</button><button class="chip" data-f="${esc(filter)}">Kembali</button>`;
    box.querySelector('input').focus();
  }
  if (t.dataset.doclose) {
    const al = document.getElementById('cl-' + t.dataset.doclose).value.trim();
    if (!al) { document.getElementById('cl-' + t.dataset.doclose).placeholder = 'Alasan wajib diisi'; return; }
    t.disabled = true;
    api({ action: 'adminCloseRemainder', staffId: auth.staffId, pin: auth.pin, orderId: t.dataset.doclose, alasan: al }).then(r => {
      flash = r.ok ? { ok: true, text: t.dataset.doclose + ': sisa ditutup (' + r.order.statusLabel + ').' } : { ok: false, text: r.error };
      load();
    });
  }
  if (t.dataset.f !== undefined) { filter = t.dataset.f; render(); }
  if (t.dataset.validate) { t.disabled = true; t.textContent = 'Memproses…'; setStatus(t.dataset.validate, 'DIVALIDASI'); }
  if (t.dataset.cancel) {
    const box = document.querySelector(`[data-box="${t.dataset.cancel}"]`);
    box.innerHTML = `<input placeholder="Alasan pembatalan (wajib)" id="al-${esc(t.dataset.cancel)}">
      <button class="btn ghost" data-docancel="${esc(t.dataset.cancel)}">Batalkan pesanan</button>
      <button class="chip" data-f="${esc(filter)}">Kembali</button>`;
    box.querySelector('input').focus();
  }
  if (t.dataset.docancel) {
    const al = document.getElementById('al-' + t.dataset.docancel).value.trim();
    if (!al) { document.getElementById('al-' + t.dataset.docancel).placeholder = 'Alasan wajib diisi'; return; }
    t.disabled = true; t.textContent = 'Memproses…';
    setStatus(t.dataset.docancel, 'BATAL', al);
  }
});

document.addEventListener('input', e => {
  if (tgForm && e.target.dataset.pfamt) { if (e.target.value.trim() !== '') tgForm.pick[e.target.dataset.pfamt] = e.target.value.replace(/\D/g, ''); const ck = document.querySelector(`[data-pfck="${e.target.dataset.pfamt}"]`); if (ck && e.target.value.trim()) ck.checked = true; tgUpdTotal(); }
  if (form && e.target.dataset.q) setFormQty(e.target.dataset.q, e.target.value);
  if (shipForm && e.target.dataset.sq) setShipQty(e.target.dataset.sq, e.target.value);
});
document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.terima) { e.target.checked ? terimaPick.add(d.terima) : terimaPick.delete(d.terima); return keepScroll(renderProduksi); }
  if (d.po) { e.target.checked ? prodPick.add(d.po) : prodPick.delete(d.po); return keepScroll(renderProduksi); }
  if (d.poall !== undefined) { d.poall.split(',').filter(Boolean).forEach(id => e.target.checked ? prodPick.add(id) : prodPick.delete(id)); return keepScroll(renderProduksi); }
  if (d.sp) { e.target.checked ? shipPick.add(d.sp) : shipPick.delete(d.sp); return keepScroll(renderPengiriman); }
  if (tgForm && d.pfck) {
    const g = tgInv.piutang.find(x => x.customerId === tgForm.cid), v = g && g.invoices.find(x => x.id === d.pfck);
    if (e.target.checked) tgForm.pick[d.pfck] = (document.querySelector(`[data-pfamt="${d.pfck}"]`).value.replace(/\D/g, '')) || String(v ? v.sisa : ''); else delete tgForm.pick[d.pfck];
    return keepScroll(renderTagihan);
  }
  if (d.setlot) return setLot(d.setlot, d.item, e.target.value, e.target);
  if (e.target.dataset.kurir !== undefined) shipUpdate(e.target.dataset.kurir, { kurirId: e.target.value }, '{id}: kurir diperbarui.');
});

load();
</script>
</body>
</html>
