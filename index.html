<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hungry Bird Roastery — Order</title>
<style>
  :root {
    --bg: #f6f1ea; --card: #ffffff; --ink: #2b1d14; --muted: #7a6a5d; --line: #e6dccf;
    --brand: #4a2e1c; --accent: #b5652b; --ok: #2f7a4a; --err: #a33a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1410; --card: #251b15; --ink: #f1e7dc; --muted: #b3a294; --line: #3a2c22; --brand: #e3c3a3; --accent: #e08a4c; --ok: #6cc28c; --err: #ef8a7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--brand); color: #fff; padding: 18px 16px 20px; }
  @media (prefers-color-scheme: dark) { header { background: #3a2417; } }
  header small { opacity: .75; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
  header h1 { margin: 2px 0 0; font-size: 20px; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .price { font-weight: 600; white-space: nowrap; text-align: right; }
  .tag { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; margin-top: 2px; }
  .msg { padding: 28px 16px; text-align: center; color: var(--muted); }
  .msg.err { color: var(--err); }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin: 18px 0 8px; }
</style>
</head>
<body>
<header>
  <small id="usaha">Hungry Bird Coffee Roaster</small>
  <h1 id="nama">Memuat…</h1>
</header>
<main id="main"><div class="msg">Memuat data…</div></main>

<script>
// Ganti dengan URL web app Apps Script OMS (Deploy → Web app → URL yang berakhiran /exec)
const API = 'GANTI_DENGAN_URL_WEB_APP_OMS';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = s => { const d = new Date(s + 'T00:00:00+08:00'); return isNaN(d) ? s : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); };

async function api(body) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) {
    // Jalur cadangan seperti di aplikasi kurir: kirim lewat GET bila POST diblokir browser
    const r = await fetch(API + '?q=' + encodeURIComponent(JSON.stringify(body)));
    return await r.json();
  }
}

function fail(msg) {
  $('#nama').textContent = 'Tidak bisa dibuka';
  $('#main').innerHTML = '<div class="msg err">' + esc(msg) + '</div>';
}

async function start() {
  const token = new URLSearchParams(location.search).get('t');
  if (!token) return fail('Link tidak lengkap. Gunakan link yang dikirim admin.');
  let d;
  try { d = await api({ action: 'customerInit', token }); }
  catch (e) { return fail('Tidak bisa terhubung ke server. Periksa koneksi internet lalu muat ulang.'); }
  if (!d.ok) return fail(d.error);

  if (d.usaha) $('#usaha').textContent = d.usaha;
  $('#nama').textContent = d.customer.nama;
  document.title = d.customer.nama + ' — ' + (d.usaha || 'Order');

  const katalog = d.katalog.length
    ? d.katalog.map(p => `<div class="row"><div><div class="name">${esc(p.nama)}</div>
        <div class="sub">${esc([p.origin, p.profil].filter(Boolean).join(' · '))}</div>
        ${p.hargaKhusus ? '<span class="tag">Harga khusus</span>' : ''}</div>
        <div class="price">${rp(p.harga)}</div></div>`).join('')
    : '<div class="sub">Katalog belum diatur. Hubungi admin.</div>';

  const kiriman = d.kiriman.length
    ? d.kiriman.map(k => `<div class="row"><div><div class="name">${esc(tgl(k.tanggal))} · ${esc(k.jam)}</div>
        <div class="sub">${esc(k.catatan || '—')}</div></div>
        <div class="sub" style="text-align:right">Diterima<br>${esc(k.penerima || '—')}</div></div>`).join('')
    : '<div class="sub">Belum ada kiriman tercatat.</div>';

  $('#main').innerHTML = `
    <section><h2>Katalog & harga Anda</h2>${katalog}</section>
    <section><h2>Kiriman terakhir</h2>${kiriman}</section>
    <p class="note">Versi uji coba. Fitur pemesanan menyusul.</p>`;
}
start();
</script>
</body>
</html>
